<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1080" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <style>
      .node-label { font-weight: 700; font-size: 15px; }
      .node-sub { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10.5px; fill: #93A1B0; }
      .section-label { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; font-weight: 700; }
      .edge-label { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-weight: 600; font-size: 11px; }
      .path-line { fill: none; stroke: #2C3A4A; stroke-width: 2; }
      .path-dashed { fill: none; stroke: #6C9BFF; stroke-width: 1.75; stroke-dasharray: 5 5; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C9BFF"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1080" fill="#0E1520"/>
  <rect x="12" y="12" width="976" height="1056" rx="16" fill="#16202C" stroke="#2C3A4A"/>

  <!-- ===== main spine (straight) ===== -->
  <path class="path-line" d="M 500 120 L 500 155" />
  <path class="path-line" d="M 500 225 L 500 260" />
  <path class="path-line" d="M 500 480 L 500 515" />
  <path class="path-line" d="M 500 735 L 500 770" />
  <path class="path-line" d="M 500 910 L 500 945" />

  <!-- ===== branch connectors (curved) ===== -->
  <path class="path-line" d="M 895 620 C 895 625, 895 625, 895 630" />
  <path class="path-line" d="M 800 665 C 755 650, 730 635, 710 620" />
  <path class="path-dashed" d="M 246 367 C 265 367, 270 367, 290 367" />
  <path class="path-dashed" d="M 410 945 C 150 900, 80 780, 290 680" marker-end="url(#arrow-blue)" />
  <text x="75" y="828" class="edge-label" fill="#6C9BFF">mark complete /</text>
  <text x="75" y="842" class="edge-label" fill="#6C9BFF">cancel orders</text>

  <!-- ===== Customer ===== -->
  <rect x="370" y="30" width="260" height="90" rx="12" fill="#1C2836" stroke="#2C3A4A"/>
  <text x="500" y="70" text-anchor="middle" class="node-label" fill="#E8ECF2">Customer</text>
  <text x="500" y="90" text-anchor="middle" class="node-sub">via Facebook Messenger</text>

  <!-- ===== API Gateway ===== -->
  <rect x="410" y="155" width="180" height="70" rx="10" fill="#1B2A44" stroke="#6C9BFF"/>
  <text x="500" y="186" text-anchor="middle" class="node-label" fill="#6C9BFF">API Gateway</text>
  <text x="500" y="204" text-anchor="middle" class="node-sub">REST · Prod stage</text>

  <!-- ===== webhook-receiver ===== -->
  <rect x="290" y="260" width="420" height="220" rx="14" fill="#103330" stroke="#3DD9CB" stroke-width="1.5"/>
  <text x="500" y="300" text-anchor="middle" class="node-label" fill="#3DD9CB">webhook-receiver</text>
  <text x="500" y="318" text-anchor="middle" class="node-sub">Lambda · handleWebhook()</text>
  <line x1="320" y1="333" x2="680" y2="333" stroke="#1f5850"/>
  <text x="320" y="360" class="node-sub" fill="#8FE0D6">verifies signature (Meta App Secret)</text>
  <text x="320" y="384" class="node-sub" fill="#8FE0D6">LLM parse — LangChain + Anthropic Claude</text>
  <text x="320" y="408" class="node-sub" fill="#8FE0D6">validates LLM output with Zod schema</text>
  <text x="320" y="432" class="node-sub" fill="#8FE0D6">cross-checks parsed items vs. menu_items</text>
  <text x="320" y="456" class="node-sub" fill="#8FE0D6">writes order to Supabase</text>

  <!-- ===== Supabase ===== -->
  <rect x="290" y="515" width="420" height="220" rx="14" fill="#12301F" stroke="#4FCB8F" stroke-width="1.5"/>
  <text x="500" y="555" text-anchor="middle" class="node-label" fill="#4FCB8F">Supabase (Postgres)</text>
  <line x1="320" y1="570" x2="680" y2="570" stroke="#1f4a34"/>
  <text x="320" y="595" class="section-label" fill="#4FCB8F">Triggers:</text>
  <text x="335" y="617" class="node-sub" fill="#8CE0AE">purge customer data on complete / cancel</text>
  <text x="335" y="637" class="node-sub" fill="#8CE0AE">clear notes on order complete</text>
  <text x="320" y="667" class="section-label" fill="#4FCB8F">Webhooks: → notifications Lambda</text>
  <text x="335" y="689" class="node-sub" fill="#8CE0AE">orders — on INSERT</text>
  <text x="335" y="709" class="node-sub" fill="#8CE0AE">customer_info — on driver_id UPDATE</text>

  <!-- ===== notifications ===== -->
  <rect x="340" y="770" width="320" height="140" rx="12" fill="#1C2836" stroke="#2C3A4A"/>
  <text x="500" y="808" text-anchor="middle" class="node-label" fill="#E8ECF2">notifications</text>
  <text x="500" y="826" text-anchor="middle" class="node-sub">Lambda · on Supabase DB webhook</text>
  <line x1="360" y1="840" x2="640" y2="840" stroke="#33404f"/>
  <text x="360" y="864" class="node-sub" fill="#A9B4C0">push: new-order alerts to opt-in staff</text>
  <text x="360" y="886" class="node-sub" fill="#A9B4C0">push: delivery-assignment alerts to drivers</text>

  <!-- ===== Mobile App ===== -->
  <rect x="370" y="945" width="260" height="90" rx="12" fill="#241B3D" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="500" y="985" text-anchor="middle" class="node-label" fill="#A78BFA">Mobile App</text>
  <text x="500" y="1005" text-anchor="middle" class="node-sub">separate repo</text>

  <!-- ===== Secrets Manager (left branch) ===== -->
  <rect x="16" y="315" width="230" height="105" rx="10" fill="#1B2A44" stroke="#6C9BFF"/>
  <text x="131" y="353" text-anchor="middle" class="node-label" fill="#6C9BFF">Secrets Manager</text>
  <text x="131" y="377" text-anchor="middle" class="node-sub">Supabase creds — all 3 functions</text>
  <text x="131" y="397" text-anchor="middle" class="node-sub">+ Anthropic key — webhook only</text>

  <!-- ===== EventBridge + weekly-cleanup (right branch) ===== -->
  <rect x="800" y="550" width="190" height="70" rx="10" fill="#1B2A44" stroke="#6C9BFF"/>
  <text x="895" y="580" text-anchor="middle" class="node-label" fill="#6C9BFF">EventBridge</text>
  <text x="895" y="598" text-anchor="middle" class="node-sub">Mon 12:00 AM Pacific</text>

  <rect x="800" y="630" width="190" height="70" rx="10" fill="#1C2836" stroke="#2C3A4A"/>
  <text x="895" y="660" text-anchor="middle" class="node-label" fill="#E8ECF2">weekly-cleanup</text>
  <text x="895" y="678" text-anchor="middle" class="node-sub">purges abandoned orders</text>
</svg>
