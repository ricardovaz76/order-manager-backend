<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1080" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <style>
      .node-label { font-weight: 700; font-size: 15px; }
      .node-sub { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10.5px; fill: #5B6878; }
      .section-label { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; font-weight: 700; }
      .edge-label { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-weight: 600; font-size: 11px; }
      .path-line { fill: none; stroke: #C7CFD9; stroke-width: 2; }
      .path-dashed { fill: none; stroke: #2F6FED; stroke-width: 1.75; stroke-dasharray: 5 5; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6FED"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1080" fill="#F6F7F9"/>
  <rect x="12" y="12" width="976" height="1056" rx="16" fill="#FFFFFF" stroke="#E3E7ED"/>

  <!-- ===== main spine (straight) ===== -->
  <path class="path-line" d="M 500 120 L 500 155" />
  <path class="path-line" d="M 500 225 L 500 260" />
  <path class="path-line" d="M 500 480 L 500 515" />
  <path class="path-line" d="M 500 735 L 500 770" />
  <path class="path-line" d="M 500 910 L 500 945" />

  <!-- ===== branch connectors (curved) ===== -->
  <path class="path-line" d="M 895 620 C 895 625, 895 625, 895 630" />
  <path class="path-line" d="M 800 665 C 755 650, 730 635, 710 620" />
  <path class="path-dashed" d="M 246 367 C 265 367, 270 367, 290 367" />
  <path class="path-dashed" d="M 410 945 C 150 900, 80 780, 290 680" marker-end="url(#arrow-blue)" />
  <text x="75" y="828" class="edge-label" fill="#2F6FED">mark complete /</text>
  <text x="75" y="842" class="edge-label" fill="#2F6FED">cancel orders</text>

  <!-- ===== Customer ===== -->
  <rect x="370" y="30" width="260" height="90" rx="12" fill="#EEF1F5" stroke="#C7CFD9"/>
  <text x="500" y="70" text-anchor="middle" class="node-label" fill="#1A2230">Customer</text>
  <text x="500" y="90" text-anchor="middle" class="node-sub">via Facebook Messenger</text>

  <!-- ===== API Gateway ===== -->
  <rect x="410" y="155" width="180" height="70" rx="10" fill="#E8EFFE" stroke="#2F6FED"/>
  <text x="500" y="186" text-anchor="middle" class="node-label" fill="#2F6FED">API Gateway</text>
  <text x="500" y="204" text-anchor="middle" class="node-sub">REST · Prod stage</text>

  <!-- ===== webhook-receiver ===== -->
  <rect x="290" y="260" width="420" height="220" rx="14" fill="#E1F5F3" stroke="#0D9C93" stroke-width="1.5"/>
  <text x="500" y="300" text-anchor="middle" class="node-label" fill="#0D9C93">webhook-receiver</text>
  <text x="500" y="318" text-anchor="middle" class="node-sub">Lambda · handleWebhook()</text>
  <line x1="320" y1="333" x2="680" y2="333" stroke="#B7E4E0"/>
  <text x="320" y="360" class="node-sub" fill="#3a5a56">verifies signature (Meta App Secret)</text>
  <text x="320" y="384" class="node-sub" fill="#3a5a56">LLM parse — LangChain + Anthropic Claude</text>
  <text x="320" y="408" class="node-sub" fill="#3a5a56">validates LLM output with Zod schema</text>
  <text x="320" y="432" class="node-sub" fill="#3a5a56">cross-checks parsed items vs. menu_items</text>
  <text x="320" y="456" class="node-sub" fill="#3a5a56">writes order to Supabase</text>

  <!-- ===== Supabase ===== -->
  <rect x="290" y="515" width="420" height="220" rx="14" fill="#E4F6ED" stroke="#1E9E6B" stroke-width="1.5"/>
  <text x="500" y="555" text-anchor="middle" class="node-label" fill="#1E9E6B">Supabase (Postgres)</text>
  <line x1="320" y1="570" x2="680" y2="570" stroke="#BCE7D2"/>
  <text x="320" y="595" class="section-label" fill="#175f43">Triggers:</text>
  <text x="335" y="617" class="node-sub" fill="#2c5f45">purge customer data on complete / cancel</text>
  <text x="335" y="637" class="node-sub" fill="#2c5f45">clear notes on order complete</text>
  <text x="320" y="667" class="section-label" fill="#175f43">Webhooks: → notifications Lambda</text>
  <text x="335" y="689" class="node-sub" fill="#2c5f45">orders — on INSERT</text>
  <text x="335" y="709" class="node-sub" fill="#2c5f45">customer_info — on driver_id UPDATE</text>

  <!-- ===== notifications ===== -->
  <rect x="340" y="770" width="320" height="140" rx="12" fill="#EEF1F5" stroke="#C7CFD9"/>
  <text x="500" y="808" text-anchor="middle" class="node-label" fill="#1A2230">notifications</text>
  <text x="500" y="826" text-anchor="middle" class="node-sub">Lambda · on Supabase DB webhook</text>
  <line x1="360" y1="840" x2="640" y2="840" stroke="#D7DBE2"/>
  <text x="360" y="864" class="node-sub" fill="#4a5563">push: new-order alerts to opt-in staff</text>
  <text x="360" y="886" class="node-sub" fill="#4a5563">push: delivery-assignment alerts to drivers</text>

  <!-- ===== Mobile App ===== -->
  <rect x="370" y="945" width="260" height="90" rx="12" fill="#F1ECFE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="500" y="985" text-anchor="middle" class="node-label" fill="#8B5CF6">Mobile App</text>
  <text x="500" y="1005" text-anchor="middle" class="node-sub">separate repo</text>

  <!-- ===== Secrets Manager (left branch) ===== -->
  <rect x="16" y="315" width="230" height="105" rx="10" fill="#E8EFFE" stroke="#2F6FED"/>
  <text x="131" y="353" text-anchor="middle" class="node-label" fill="#2F6FED">Secrets Manager</text>
  <text x="131" y="377" text-anchor="middle" class="node-sub">Supabase creds — all 3 functions</text>
  <text x="131" y="397" text-anchor="middle" class="node-sub">+ Anthropic key — webhook only</text>

  <!-- ===== EventBridge + weekly-cleanup (right branch) ===== -->
  <rect x="800" y="550" width="190" height="70" rx="10" fill="#E8EFFE" stroke="#2F6FED"/>
  <text x="895" y="580" text-anchor="middle" class="node-label" fill="#2F6FED">EventBridge</text>
  <text x="895" y="598" text-anchor="middle" class="node-sub">Mon 12:00 AM Pacific</text>

  <rect x="800" y="630" width="190" height="70" rx="10" fill="#EEF1F5" stroke="#C7CFD9"/>
  <text x="895" y="660" text-anchor="middle" class="node-label" fill="#1A2230">weekly-cleanup</text>
  <text x="895" y="678" text-anchor="middle" class="node-sub">purges abandoned orders</text>
</svg>
