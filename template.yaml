AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  restaurant-app-backend

  Meta Messenger webhook receiver + LLM order extraction pipeline

Globals:
  Function:
    Timeout: 20
    LoggingConfig:
      LogFormat: JSON

Parameters:
  SupabaseUrl:
    Type: String
  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
  MetaVerifyToken:
    Type: String
    NoEcho: true
  MetaAppSecret:
    Type: String
    NoEcho: true
  AnthropicApiKey:
    Type: String
    NoEcho: true

Resources:
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: webhook-receiver/
      Handler: app.handler
      Runtime: nodejs20.x
      Architectures:
      - x86_64
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
          META_VERIFY_TOKEN: !Ref MetaVerifyToken
          META_APP_SECRET: !Ref MetaAppSecret
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
      Events:
        WebhookVerify:
          Type: Api
          Properties:
            Path: /webhook
            Method: get
        WebhookReceive:
          Type: Api
          Properties:
            Path: /webhook
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
        - app.ts

Outputs:
  WebhookApi:
    Description: API Gateway endpoint URL for Prod stage for the webhook function
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/webhook/"
  WebhookFunction:
    Description: Webhook Lambda Function ARN
    Value: !GetAtt WebhookFunction.Arn
  WebhookFunctionIamRole:
    Description: Implicit IAM Role created for the webhook function
    Value: !GetAtt WebhookFunctionRole.Arn