AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  restaurant-app-backend

  Meta Messenger webhook receiver + LLM order extraction pipeline

Globals:
  Function:
    Timeout: 20
    LoggingConfig:
      LogFormat: JSON

Parameters:
  SupabaseUrl:
    Type: String
  BackendSecretsArn:
    Type: String
    Default: "arn:aws:secretsmanager:us-west-2:750240011710:secret:restaurant-order-manager/backend-YQHyKb"
  AlertEmail:
    Type: String
    Description: Email address to notify on backend alarms

Resources:
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: webhook-receiver/
      Handler: app.handler
      Runtime: nodejs20.x
      Architectures:
      - x86_64
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          BACKEND_SECRETS_ARN: !Ref BackendSecretsArn
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref BackendSecretsArn
      Events:
        WebhookVerify:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /webhook
            Method: get
        WebhookReceive:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /webhook
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
        - app.ts

  NotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: notifications/
      Handler: app.handler
      Runtime: nodejs20.x
      Architectures:
      - x86_64
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          BACKEND_SECRETS_ARN: !Ref BackendSecretsArn
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref BackendSecretsArn
      Events:
        NotificationsReceive:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /notifications
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties: 
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
        - app.ts

  WeeklyCleanupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: weekly-cleanup/
      Handler: app.handler
      Runtime: nodejs20.x
      Architectures:
      - x86_64
      Timeout: 30
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          BACKEND_SECRETS_ARN: !Ref BackendSecretsArn
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref BackendSecretsArn
      Events:
        WeeklyCleanupSchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 0 ? * MON *)"
            ScheduleExpressionTimezone: "America/Los_Angeles"
            FlexibleTimeWindow:
              Mode: "OFF"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
        - app.ts

  BackendApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: restaurant-app-backend-waf
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: restaurant-app-backend-waf
      Rules:
        - Name: RateLimitRule
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 100
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitRule

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    DependsOn: BackendApiProdStage
    Properties:
      ResourceArn: !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/${BackendApi}/stages/Prod"
      WebACLArn: !GetAtt WebAcl.Arn

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: restaurant-app-backend-alerts

  AlertsTopicEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  MessageDroppedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WebhookFunction}"
      FilterPattern: '"MESSAGE_DROPPED"'
      MetricTransformations:
        - MetricName: MessageDropped
          MetricNamespace: RestaurantApp/Webhook
          MetricValue: "1"
          DefaultValue: 0

  MessageDroppedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: restaurant-app-webhook-message-dropped
      AlarmDescription: "Fires when a webhook message is silently dropped due to a DB lookup failure"
      Namespace: RestaurantApp/Webhook
      MetricName: MessageDropped
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
  

Outputs:
  WebhookFunction:
    Description: Webhook Lambda Function ARN
    Value: !GetAtt WebhookFunction.Arn
  WebhookFunctionIamRole:
    Description: Implicit IAM Role created for the webhook function
    Value: !GetAtt WebhookFunctionRole.Arn
  NotificationsFunctionIamRole:
    Description: Implicit IAM Role created for the notifications function
    Value: !GetAtt NotificationsFunctionRole.Arn