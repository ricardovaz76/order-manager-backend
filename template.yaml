AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  restaurant-app-backend

  Meta Messenger webhook receiver + LLM order extraction pipeline

Globals:
  Function:
    Timeout: 20
    LoggingConfig:
      LogFormat: JSON

Parameters:
  SupabaseUrl:
    Type: String
  BackendSecretsArn:
    Type: String
    Default: "arn:aws:secretsmanager:us-west-2:750240011710:secret:restaurant-order-manager/backend-YQHyKb"

Resources:
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: webhook-receiver/
      Handler: app.handler
      Runtime: nodejs20.x
      Architectures:
      - x86_64
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          BACKEND_SECRETS_ARN: !Ref BackendSecretsArn
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref BackendSecretsArn
      Events:
        WebhookVerify:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /webhook
            Method: get
        WebhookReceive:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /webhook
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
        - app.ts
  NotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: notifications/
      Handler: app.handler
      Runtime: nodejs20.x
      Architectures:
      - x86_64
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          BACKEND_SECRETS_ARN: !Ref BackendSecretsArn
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref BackendSecretsArn
      Events:
        NotificationsReceive:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /notifications
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties: 
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
        - app.ts
  BackendApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: restaurant-app-backend-waf
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: restaurant-app-backend-waf
      Rules:
        - Name: RateLimitRule
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 100
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitRule
  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    DependsOn: BackendApiStage
    Properties:
      ResourceArn: !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/${BackendApi}/stages/Prod"
      WebACLId: !GetAtt WebAcl.Arn

Outputs:
  WebhookFunction:
    Description: Webhook Lambda Function ARN
    Value: !GetAtt WebhookFunction.Arn
  WebhookFunctionIamRole:
    Description: Implicit IAM Role created for the webhook function
    Value: !GetAtt WebhookFunctionRole.Arn
  NotificationsFunctionIamRole:
    Description: Implicit IAM Role created for the notifications function
    Value: !GetAtt NotificationsFunctionRole.Arn